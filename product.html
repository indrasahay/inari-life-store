<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Product details · Inari Life</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<script src="catalog.js?v=20261109"></script>
<style>
:root{--navy:#10294a;--amber:#e8892b;--paper:#faf9f6;--ink:#1d2a3a;--muted:#707b89;--line:#e9e5de;--soft:#f3efe9}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:'DM Sans',sans-serif}
a{color:inherit;text-decoration:none}
button:focus-visible,a:focus-visible{outline:3px solid #e8892b88;outline-offset:2px}
.wrap{max-width:1120px;margin:auto;padding:0 clamp(14px,3vw,24px)}
/* --- Compact header: no dead space, logo with fallback --- */
.header{display:flex;align-items:center;justify-content:space-between;gap:14px;min-height:64px;padding:10px 0;border-bottom:1px solid var(--line);background:#faf9f6ee;position:sticky;top:0;z-index:20;backdrop-filter:blur(14px)}
.logo{display:block;width:min(188px,40vw);height:auto}
.logo-fallback{display:inline-flex;flex-direction:column;line-height:1}
.logo-fallback b{font:800 clamp(16px,1.8vw,20px) Manrope,sans-serif;letter-spacing:.14em;color:var(--navy)}
.logo-fallback small{font:600 8px 'DM Sans',sans-serif;letter-spacing:.32em;color:#b96928;margin-top:4px;text-transform:uppercase}
.back-link{font-size:13px;font-weight:700;color:var(--navy);white-space:nowrap;padding:8px 14px;border:1px solid var(--line);border-radius:999px;background:#fff}
.back-link:hover{border-color:#e5a95f;color:#8c4f16}
/* --- PDP: tight top padding (was 42px of dead space) --- */
.detail{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:clamp(22px,4vw,48px);align-items:start;padding:18px 0 26px}
.photo{height:min(56vw,560px);border-radius:16px;background:var(--soft);display:grid;place-items:center;overflow:hidden}
.photo img{width:100%;height:100%;object-fit:contain;padding:16px}
.placeholder{text-align:center;color:var(--navy);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;height:100%;width:100%}
.placeholder-mark{width:min(160px,34%);height:auto;object-fit:contain;mix-blend-mode:multiply}
.placeholder b{font:700 11px Manrope;letter-spacing:.16em;color:var(--navy)}
.placeholder small{font-size:11px;color:#8d8174}
h1{font:700 clamp(24px,3.6vw,42px)/1.15 Manrope;color:var(--navy);margin:10px 0 12px}
p,li{line-height:1.75;color:#4a5768;margin:0 0 12px}
.crumb{font-size:12px;color:#a46c37;margin-bottom:2px}
.crumb a:hover{color:#8c4f16}
.prices{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:6px 0 6px}
.price-pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:9px 14px;font-weight:700;white-space:nowrap}
.price-pill.mrp{background:#e9eef6;color:var(--navy);border:1px solid #d8e1ec;text-decoration:line-through;color:#8c9299}
.price-pill.offer{background:var(--navy);color:#fff}
.discount-bubble{display:inline-flex;align-items:center;justify-content:center;min-width:44px;height:36px;padding:0 10px;border-radius:999px;background:var(--amber);color:#10294a;font-weight:800}
.quiet{color:var(--muted);font-size:12px}
.features{padding-left:20px}
.features li{margin:.4em 0}
h2{font:700 19px Manrope;color:var(--navy);margin:18px 0 8px}
.sku-line{margin-top:14px}
/* --- In-flow Buy Now button --- */
.card-buy{position:relative;display:inline-flex;justify-content:center;align-items:center;background:#111!important;color:#fff!important;border-radius:999px!important;padding:15px 34px;min-width:min(260px,100%);font-size:16px;font-weight:800;letter-spacing:.04em;overflow:hidden;margin:6px 0 2px}
.amazon-wordmark{position:absolute;inset:0;display:grid;place-items:center;background:#fff;color:#18212c;font-size:17px;font-weight:800;opacity:0;transform:translateY(8px);transition:opacity .18s,transform .18s}
.amazon-wordmark i{position:absolute;width:28px;height:7px;border-bottom:2px solid #e8892b;border-radius:50%;top:26px}
.card-buy:hover .amazon-wordmark,.card-buy:focus-visible .amazon-wordmark{opacity:1;transform:translateY(0)}
/* --- Sticky Buy Now bar: appears only when the in-flow button is off screen --- */
.buy-bar{position:fixed;left:0;right:0;bottom:0;z-index:60;display:flex;justify-content:center;padding:10px 14px calc(10px + env(safe-area-inset-bottom));background:#fffffffa;border-top:1px solid var(--line);box-shadow:0 -8px 24px #10294a14;transform:translateY(110%);transition:transform .25s ease;backdrop-filter:blur(10px)}
.buy-bar.show{transform:translateY(0)}
.buy-bar .card-buy{min-width:min(320px,92vw);margin:0}
.footer{background:var(--navy);color:white;padding:22px 0;margin-top:26px}
.footer .wrap{font-size:13px;color:#c7d0d8}
/* --- Mobile --- */
@media(max-width:760px){
.wrap{padding:0 14px}
.header{min-height:56px;padding:8px 0;gap:10px}
.logo{width:min(132px,40vw)}
.back-link{font-size:12px;padding:7px 12px}
.detail{grid-template-columns:1fr;gap:18px;padding:14px 0 20px}
.photo{height:min(96vw,440px)}
h1{font-size:26px}
.card-buy{width:100%}
}
</style>
</head>
<body>
<script>function logoFallback(img){if(img.dataset.fb)return;img.dataset.fb='1';img.style.display='none';let s=document.createElement('span');s.className='logo-fallback';s.innerHTML='<b>INARI LIFE</b><small>Everyday living</small>';img.insertAdjacentElement('afterend',s)}</script>
<header class="header wrap">
<a href="index.html#home" aria-label="Inari Life home"><img class="logo" src="media/inari-life-logo.png?v=20261109" alt="Inari Life" onerror="logoFallback(this)"></a>
<a class="back-link" href="index.html#shop">← Back to shop</a>
</header>
<main id="product" class="wrap"></main>
<footer class="footer"><div class="wrap">Inari Life · Purchases are completed on the relevant Amazon listing.</div></footer>
<div class="buy-bar" id="buybar" aria-hidden="true"><a class="card-buy" target="_blank" rel="noopener noreferrer"><span>BUY NOW</span><span class="amazon-wordmark" aria-hidden="true">amazon.in<i></i></span></a></div>
<script>
const sku=new URLSearchParams(location.search).get('sku')||'';
let products=window.INARI_PRODUCTS||[];
try{const saved=JSON.parse(localStorage.getItem('inari-life-state-v2'));if(saved?.products?.length)products=saved.products}catch{}
const seed=(window.INARI_PRODUCTS||[]).find(x=>x.sku===sku),savedProduct=products.find(x=>x.sku===sku);
const p=seed?{...seed,...savedProduct,category:['Health & Wellness','Personal Care','Kitchen Tools','Home Improvements','Sports & Fitness','Toys & Games','Tools & Gadgets','Home Decor'].includes(savedProduct?.department)?savedProduct.department:seed.department,description:savedProduct?.description||seed.description,features:savedProduct?.features?.length?savedProduct.features:seed.features,price:savedProduct?.price||seed.price,sellingPrice:savedProduct?.sellingPrice||seed.sellingPrice,mrp:savedProduct?.mrp||seed.mrp,discountPercent:savedProduct?.discountPercent||seed.discountPercent,amazonUrl:savedProduct?.amazonUrl||seed.amazonUrl,image:savedProduct?.image||seed.image}:savedProduct;
function recordOutbound(sku){try{const key='inari-life-state-v2',data=JSON.parse(localStorage.getItem(key))||{};data.clicks=data.clicks||[];data.clicks.push({sku,at:new Date().toISOString()});localStorage.setItem(key,JSON.stringify(data))}catch{}}
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>'₹'+Number(n).toLocaleString('en-IN',{maximumFractionDigits:2});
function logoFallback(img){if(img.dataset.fb)return;img.dataset.fb='1';img.style.display='none';let s=document.createElement('span');s.className='logo-fallback';s.innerHTML='<b>INARI LIFE</b><small>Everyday living</small>';img.insertAdjacentElement('afterend',s)}
let root=document.getElementById('product');
if(!p){root.innerHTML='<p>We could not find this product. <a href="index.html#shop">Return to shop</a></p>'}
else{
let mrp=p.mrp?Number(p.mrp):NaN,sp=p.sellingPrice||p.price?Number(p.sellingPrice||p.price):NaN,discount=p.discountPercent?Number(p.discountPercent):NaN;
let price=`<div class="prices">${Number.isFinite(mrp)?`<span class="price-pill mrp">MRP ${fmt(mrp)}</span>`:''}${Number.isFinite(sp)?`<span class="price-pill offer">Offer Price ${fmt(sp)}</span>`:''}${Number.isFinite(discount)?`<span class="discount-bubble">${discount}%</span>`:''}</div>`;
root.innerHTML=`<section class="detail">
<div class="photo">${p.image?`<img src="${esc(p.image)}" alt="${esc(p.alt||p.name)}">`:`<div class="placeholder"><img class="placeholder-mark" src="media/inari-mark.jpg?v=20261109" alt="" onerror="this.style.display='none'"><b>INARI LIFE</b><small>Product photo pending</small></div>`}</div>
<div>
<div class="crumb"><a href="index.html#shop">Shop</a> / ${esc(p.department||'Everyday living')}</div>
<h1>${esc(p.name)}</h1>
${p.description?`<p>${esc(p.description)}</p>`:''}
${price?price+`<p class="quiet">Prices and discount are shown as provided in the workbook. Confirm current pricing on Amazon.</p>`:''}
${p.features?.length?`<h2>Product features</h2><ul class="features">${p.features.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:''}
<p class="quiet sku-line">SKU ${esc(p.sku)}</p>
${p.amazonUrl?`<a class="card-buy" id="mainbuy" aria-label="Buy now on Amazon for ${esc(p.name)}" href="${esc(p.amazonUrl)}" target="_blank" rel="noopener noreferrer" onclick="recordOutbound('${esc(p.sku)}')"><span>BUY NOW</span><span class="amazon-wordmark" aria-hidden="true">amazon.in<i></i></span></a>`:'<p>Amazon listing coming soon</p>'}
<p class="quiet">Purchases, delivery and returns are handled on Amazon.</p>
</div></section>`;
/* Sticky BUY NOW: show bar only when the in-flow button is scrolled out of view */
(function(){let main=document.getElementById('mainbuy'),bar=document.getElementById('buybar');if(!main||!bar)return;
bar.querySelector('a').href=main.href;bar.querySelector('a').setAttribute('onclick',main.getAttribute('onclick')||'');bar.setAttribute('aria-hidden','false');
if(!('IntersectionObserver' in window))return;
new IntersectionObserver(es=>{es.forEach(e=>bar.classList.toggle('show',!e.isIntersecting))},{threshold:.15}).observe(main)})();
}
</script>
</body>
</html>
